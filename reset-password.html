<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — ByteSpace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

    <header class="auth-header">
        <a href="index.html" class="auth-header__logo" id="auth-logo">
            <svg class="header__logo-icon" width="29" height="32" viewBox="0 0 29 32" fill="none">
                <path d="M14.44 0L28.88 8v16l-14.44 8L0 24V8L14.44 0z" fill="#D4FB20"/>
            </svg>
            <span class="auth-header__logo-text">ByteSpace</span>
        </a>
    </header>

    <main class="auth-container">
        <section class="auth-showcase">
            <h1 class="auth-showcase__title">Set new password</h1>
            <p class="auth-showcase__desc">Create a new, strong password to secure your ByteSpace account.</p>
        </section>

        <section class="auth-card">
            <div class="auth-card__header">
                <span class="auth-card__subtitle">Security</span>
                <h2 class="auth-card__title">Reset Password</h2>
            </div>

            <div id="auth-status" class="auth-status-msg"></div>

            <form class="auth-card__form" id="reset-form">
                <div class="auth-card__fields">
                    <div class="auth-field">
                        <label class="auth-field__label" for="reset-password">New Password</label>
                        <div class="auth-field__input-wrapper">
                            <input type="password" class="auth-field__input" id="reset-password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
                        </div>
                    </div>

                    <button type="submit" class="auth-card__submit-btn" id="reset-submit">
                        <span>Update Password</span>
                    </button>
                </div>
            </form>

            <div class="auth-card__footer">
                <span>Back to</span>
                <a href="login.html" class="auth-card__footer-link">Login</a>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
