<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — ByteSpace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

    <header class="auth-header">
        <a href="index.html" class="auth-header__logo" id="auth-logo">
            <svg class="header__logo-icon" width="29" height="32" viewBox="0 0 29 32" fill="none">
                <path d="M14.44 0L28.88 8v16l-14.44 8L0 24V8L14.44 0z" fill="#D4FB20"/>
            </svg>
            <span class="auth-header__logo-text">ByteSpace</span>
        </a>
    </header>

    <main class="auth-container">
        <section class="auth-showcase">
            <h1 class="auth-showcase__title">Reset your password</h1>
            <p class="auth-showcase__desc">Enter your email and we'll send you a password reset link to regain access to your courses and learning progress.</p>
        </section>

        <section class="auth-card">
            <div class="auth-card__header">
                <span class="auth-card__subtitle">Account Recovery</span>
                <h2 class="auth-card__title">Forgot Password</h2>
            </div>

            <div id="auth-status" class="auth-status-msg"></div>

            <form class="auth-card__form" id="forgot-form">
                <div class="auth-card__fields">
                    <div class="auth-field">
                        <label class="auth-field__label" for="forgot-email">Email</label>
                        <div class="auth-field__input-wrapper">
                            <input type="email" class="auth-field__input" id="forgot-email" placeholder="designer@example.com" required autocomplete="email">
                        </div>
                    </div>

                    <button type="submit" class="auth-card__submit-btn" id="forgot-submit">
                        <span>Send Reset Link</span>
                    </button>
                </div>
            </form>

            <div class="auth-card__footer">
                <span>Remembered it?</span>
                <a href="login.html" class="auth-card__footer-link">Log In</a>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
